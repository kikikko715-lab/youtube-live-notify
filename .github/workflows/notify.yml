name: youtube-live-notify
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Read YouTube and preview events without sending or writing"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: youtube-live-notify
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Calendar authentication library
        run: python -m pip install -r requirements.txt
      - name: Verify Calendar synchronization
        run: python -m unittest -q test_calendar_sync
      - name: Check YouTube and notify
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          # Explicit activation only after credentials and the old bridge are handled.
          PREVIEW_ONLY: ${{ vars.CALENDAR_SYNC_ACTIVE != 'true' || (github.event_name == 'workflow_dispatch' && inputs.preview_only) }}
        run: python monitor.py
      - name: Persist notification and Calendar retry state even after partial failure
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d state ]; then
            for state_file in state/notified.json state/calendar-pending.json; do
              if [ -f "$state_file" ]; then git add -- "$state_file"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "update notification and calendar retry state"
              git push
            fi
          fi


